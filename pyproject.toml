[project]
name = "jevgym"
version = "0.0.1"
description = "Open-source prompt optimizer for Jev Choice questions"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
jevgym = "jevgym.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
